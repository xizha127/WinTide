[package]
name = "winapps-windowed"
version = "0.1.1"
edition = "2021"
license = "MIT"
description = "Restore newly opened maximized Windows RemoteApp windows once"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", features = [
  "Win32_Foundation", "Win32_Security", "Win32_System_Threading", "Win32_System_RemoteDesktop",
  "Win32_Graphics_Dwm", "Win32_Graphics_Gdi",
  "Win32_UI_Accessibility", "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
strip = true
lto = true
codegen-units = 1
