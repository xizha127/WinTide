name: Check integration sources
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 -m unittest discover -s tests -v
      - run: python3 tools/check-publication.py
      - run: bash -n setup.sh
  windows-syntax:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Parse guest PowerShell without executing installation
        shell: pwsh
        run: |
          Get-ChildItem guest/*.ps1 | ForEach-Object {
            $tokens=$null; $parseErrors=$null
            [Management.Automation.Language.Parser]::ParseFile($_.FullName,[ref]$tokens,[ref]$parseErrors) | Out-Null
            if ($parseErrors.Count) { $parseErrors; throw "PowerShell syntax error" }
          }
      - name: Build and test the Windows windowed helper
        shell: pwsh
        run: |
          cargo test --locked --manifest-path guest/windowed-helper/Cargo.toml
          if ($LASTEXITCODE) { throw 'Windowed helper tests failed' }
          cargo build --locked --release --manifest-path guest/windowed-helper/Cargo.toml
          if ($LASTEXITCODE) { throw 'Windowed helper build failed' }
